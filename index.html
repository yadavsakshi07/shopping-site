<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ShopHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">ShopHub</div>

    <div class="search">
        <input type="text" placeholder="Search products...">
        <button>🔍</button>
    </div>

    <div class="nav-links">
        <a href="#">Login</a>
        <a href="#">Orders</a>
        <a href="#">Cart 🛒</a>
    </div>
</header>

<section class="banner">
    <h1>Big Deals on Electronics</h1>
    <p>Up to 70% off on trending products</p>
</section>

<section class="products">

    <div class="card">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Smart Watch">
        <h3>Smart Watch</h3>
        <p>₹1,999</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="Headphones">
        <h3>Headphones</h3>
        <p>₹999</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500" alt="Mobile Phone">
        <h3>Mobile Phone</h3>
        <p>₹12,999</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500" alt="Laptop">
        <h3>Laptop</h3>
        <p>₹45,999</p>
        <button>Add to Cart</button>
    </div>

</section>

</body>
</html>
